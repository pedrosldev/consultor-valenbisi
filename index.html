<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Valenbisi · Parada</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #22c55e;
        --danger: #ef4444;
        --warn: #f59e0b;
        --border: rgba(255, 255, 255, 0.1);
        --field: rgba(255, 255, 255, 0.06);
        --field-hover: rgba(255, 255, 255, 0.1);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 28px 24px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--muted);
        text-align: center;
        margin-bottom: 4px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .station-name {
        font-size: 1rem;
        font-weight: 500;
        text-align: center;
        color: var(--text);
        margin-bottom: 24px;
        line-height: 1.4;
      }
      .big-number {
        font-size: 5rem;
        font-weight: 800;
        text-align: center;
        line-height: 1;
        color: var(--accent);
        margin-bottom: 4px;
      }
      .big-number.warn { color: var(--warn); }
      .big-number.danger { color: var(--danger); }
      .label {
        text-align: center;
        font-size: 0.95rem;
        color: var(--muted);
        margin-bottom: 24px;
      }
      .stats {
        display: flex;
        justify-content: center;
        gap: 32px;
        margin-bottom: 24px;
      }
      .stat { text-align: center; }
      .stat-value {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--text);
      }
      .stat-label {
        font-size: 0.8rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .status {
        text-align: center;
        font-size: 0.9rem;
        padding: 8px 12px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
        margin-bottom: 16px;
      }
      .status.ok {
        color: var(--accent);
        background: rgba(34, 197, 94, 0.12);
      }
      .status.error {
        color: var(--danger);
        background: rgba(239, 68, 68, 0.12);
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 8px;
      }
      button {
        background: rgba(255, 255, 255, 0.08);
        border: none;
        color: var(--text);
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
      }
      button:active { opacity: 0.7; }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---------------- Campos ---------------- */
      .field { margin-bottom: 20px; }
      .field > label {
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 8px;
        padding-left: 4px;
      }

      /* ---------------- Buscador ---------------- */
      .search-wrap { position: relative; }
      .search-input {
        width: 100%;
        background-color: var(--field);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 16px;
        font-weight: 500;
        font-family: inherit;
        outline: none;
        -webkit-appearance: none;
        transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      }
      .search-input::placeholder { color: var(--muted); font-weight: 400; }
      .search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
      }
      .search-results {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        max-height: 320px;
        overflow-y: auto;
        z-index: 100;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      }
      .search-results[hidden] { display: none; }
      .search-item {
        padding: 12px 16px;
        cursor: pointer;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.9rem;
        display: flex;
        gap: 10px;
        align-items: center;
        -webkit-tap-highlight-color: transparent;
      }
      .search-item:last-child { border-bottom: none; }
      .search-item:active, .search-item:hover { background: rgba(255, 255, 255, 0.08); }
      .search-item .uid {
        color: var(--accent);
        font-weight: 700;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .search-item .addr { color: var(--text); line-height: 1.3; flex: 1; }
      .search-empty {
        padding: 14px;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }

      /* Estrella de habitual */
      .star-btn {
        background: none;
        border: none;
        padding: 4px 6px;
        font-size: 1.15rem;
        line-height: 1;
        color: var(--muted);
        cursor: pointer;
        flex-shrink: 0;
        border-radius: 8px;
        transition: color 0.15s ease, transform 0.1s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .star-btn:hover { color: var(--warn); }
      .star-btn:active { transform: scale(0.9); }
      .star-btn.active { color: var(--warn); }

      /* Checkbox "solo habituales" */
      .filter-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        padding-left: 4px;
        font-size: 0.85rem;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .filter-row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      /* ---------------- Select + estrella ---------------- */
      .select-row {
        display: flex;
        gap: 8px;
        align-items: stretch;
      }
      .select-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      .select-wrap select {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-color: var(--field);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 44px 14px 16px;
        font-size: 1rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        outline: none;
        transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .select-wrap select:hover { background-color: var(--field-hover); }
      .select-wrap select:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
      }
      .select-wrap::after {
        content: "";
        position: absolute;
        top: 50%;
        right: 16px;
        width: 10px;
        height: 10px;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: translateY(-70%) rotate(45deg);
        pointer-events: none;
        transition: border-color 0.15s ease;
      }
      .select-wrap:hover::after { border-color: var(--text); }
      .select-wrap select option {
        background-color: var(--card);
        color: var(--text);
        padding: 12px;
      }
      .select-wrap select optgroup {
        background-color: var(--card);
        color: var(--warn);
        font-weight: 700;
      }

      /* Botón estrella al lado del select */
      .fav-toggle {
        flex-shrink: 0;
        width: 52px;
        background-color: var(--field);
        border: 1px solid var(--border);
        border-radius: 14px;
        color: var(--muted);
        font-size: 1.5rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
        transition: color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .fav-toggle:hover { background-color: var(--field-hover); color: var(--warn); }
      .fav-toggle:active { transform: scale(0.95); }
      .fav-toggle.active { color: var(--warn); }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Buscador -->
      <div class="field">
        <label for="searchInput">Buscar</label>
        <div class="search-wrap">
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Nº o nombre de parada…"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <div id="searchResults" class="search-results" hidden></div>
        </div>
        <label class="filter-row">
          <input type="checkbox" id="onlyFavs" />
          Solo habituales
        </label>
      </div>

      <!-- Select de paradas + estrella -->
      <div class="field">
        <label for="parada">Parada</label>
        <div class="select-row">
          <div class="select-wrap">
            <select id="parada" name="parada"></select>
          </div>
          <button
            type="button"
            id="favToggle"
            class="fav-toggle"
            aria-label="Marcar como habitual"
            title="Marcar como habitual"
          >
            ☆
          </button>
        </div>
      </div>

      <h1>Valenbisi</h1>
      <div class="station-name" id="stationName">Cargando parada…</div>

      <div class="big-number" id="bigNumber">—</div>
      <div class="label">anclajes libres</div>

      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="freeBikes">—</div>
          <div class="stat-label">bicis</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="totalSlots">—</div>
          <div class="stat-label">total</div>
        </div>
      </div>

      <div class="status" id="status">Consultando datos…</div>

      <div class="footer">
        <span id="lastUpdate">—</span>
        <button id="refreshBtn" type="button">Actualizar</button>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        const FAVS_KEY = "valenbisi_favs";
        const API_URL = "https://api.citybik.es/v2/networks/valenbisi";
        const REFRESH_MS = 60_000;

        const paradaSelect = document.getElementById("parada");
        const searchInput = document.getElementById("searchInput");
        const searchResults = document.getElementById("searchResults");
        const onlyFavsCheckbox = document.getElementById("onlyFavs");
        const favToggle = document.getElementById("favToggle");

        const el = {
          stationName: document.getElementById("stationName"),
          bigNumber: document.getElementById("bigNumber"),
          freeBikes: document.getElementById("freeBikes"),
          totalSlots: document.getElementById("totalSlots"),
          status: document.getElementById("status"),
          lastUpdate: document.getElementById("lastUpdate"),
          refreshBtn: document.getElementById("refreshBtn"),
        };

        let STATION_UID = null;
        let intervalId = null;
        let alreadyOrdered = false;
        let stationsCache = [];
        let favs = loadFavs();

        /* -------------------- HABITUALES -------------------- */
        function loadFavs() {
          try {
            const raw = localStorage.getItem(FAVS_KEY);
            const arr = raw ? JSON.parse(raw) : [];
            return new Set(Array.isArray(arr) ? arr.map(String) : []);
          } catch (e) {
            return new Set();
          }
        }

        function saveFavs() {
          try {
            localStorage.setItem(FAVS_KEY, JSON.stringify([...favs]));
          } catch (e) {}
        }

        function isFav(uid) {
          return favs.has(String(uid));
        }

        function updateFavToggle() {
          const marked = STATION_UID != null && isFav(STATION_UID);
          favToggle.textContent = marked ? "★" : "☆";
          favToggle.classList.toggle("active", marked);
          favToggle.setAttribute(
            "aria-label",
            marked ? "Quitar de habituales" : "Marcar como habitual"
          );
          favToggle.title = marked
            ? "Quitar de habituales"
            : "Marcar como habitual";
        }

        function toggleFav(uid) {
          uid = String(uid);
          if (favs.has(uid)) favs.delete(uid);
          else favs.add(uid);
          saveFavs();
          rebuildSelect();
          updateFavToggle();
          if (!searchResults.hidden) renderSearchResults(searchInput.value);
        }

        /* -------------------- SELECT -------------------- */
        function getStationLabel(uid) {
          const s = stationsCache.find(
            (st) => String(st.extra?.uid) === String(uid)
          );
          if (s) return s.extra?.address || s.name || "Parada " + uid;
          return "Parada " + uid;
        }

        function rebuildSelect() {
          const current = STATION_UID || paradaSelect.value;

          const base = [];
          for (let i = 1; i <= 276; i++) base.push(String(i));
          stationsCache.forEach((s) => {
            const uid = String(s.extra?.uid || "");
            if (uid && !base.includes(uid)) base.push(uid);
          });

          const favList = base.filter(isFav);
          const restList = base.filter((u) => !isFav(u));

          const sortFn = (a, b) =>
            getStationLabel(a).localeCompare(getStationLabel(b), "es", {
              sensitivity: "base",
            });

          favList.sort(sortFn);
          restList.sort(sortFn);

          paradaSelect.innerHTML = "";

          if (favList.length) {
            const grp = document.createElement("optgroup");
            grp.label = "★ Habituales";
            favList.forEach((uid) => {
              const opt = document.createElement("option");
              opt.value = uid;
              opt.textContent = "★ " + getStationLabel(uid);
              grp.appendChild(opt);
            });
            paradaSelect.appendChild(grp);
          }

          const grpAll = document.createElement("optgroup");
          grpAll.label = favList.length ? "Todas" : "Paradas";
          restList.forEach((uid) => {
            const opt = document.createElement("option");
            opt.value = uid;
            opt.textContent = getStationLabel(uid);
            grpAll.appendChild(opt);
          });
          paradaSelect.appendChild(grpAll);

          const stillExists = [...paradaSelect.options].some(
            (o) => o.value === current
          );
          if (stillExists) {
            paradaSelect.value = current;
            STATION_UID = current;
          } else if (paradaSelect.options.length) {
            paradaSelect.selectedIndex = 0;
            STATION_UID = paradaSelect.value;
          }

          updateFavToggle();
        }

        /* -------------------- BUSCADOR -------------------- */
        function filterStations(query) {
          const q = normalize(query);
          const onlyFavs = onlyFavsCheckbox.checked;

          let list = stationsCache;
          if (onlyFavs) list = list.filter((s) => isFav(s.extra?.uid));

          if (!q) return onlyFavs ? list.slice(0, 15) : [];

          return list
            .filter((s) => {
              const uid = String(s.extra?.uid || "");
              const name = normalize(s.name);
              const addr = normalize(s.extra?.address);
              return (
                uid.includes(q) || name.includes(q) || addr.includes(q)
              );
            })
            .slice(0, 15);
        }

        function renderSearchResults(query) {
          const q = query.trim();
          const onlyFavs = onlyFavsCheckbox.checked;

          if (!q && !onlyFavs) {
            searchResults.hidden = true;
            searchResults.innerHTML = "";
            return;
          }

          if (!stationsCache.length) {
            searchResults.innerHTML =
              '<div class="search-empty">Cargando paradas…</div>';
            searchResults.hidden = false;
            return;
          }

          const results = filterStations(q);
          if (!results.length) {
            searchResults.innerHTML =
              '<div class="search-empty">' +
              (onlyFavs
                ? "No hay habituales que coincidan"
                : "Sin resultados") +
              "</div>";
            searchResults.hidden = false;
            return;
          }

          searchResults.innerHTML = results
            .map((s) => {
              const uid = String(s.extra?.uid || "");
              const addr = s.extra?.address || s.name || "";
              const marked = isFav(uid);
              return (
                '<div class="search-item" data-uid="' +
                escapeHtml(uid) +
                '">' +
                '<span class="uid">' +
                escapeHtml(uid) +
                "</span>" +
                '<span class="addr">' +
                escapeHtml(addr) +
                "</span>" +
                '<button type="button" class="star-btn' +
                (marked ? " active" : "") +
                '" data-star="' +
                escapeHtml(uid) +
                '" aria-label="' +
                (marked ? "Quitar de habituales" : "Marcar como habitual") +
                '">' +
                (marked ? "★" : "☆") +
                "</button>" +
                "</div>"
              );
            })
            .join("");

          searchResults.hidden = false;
        }

        function selectFromSearch(uid) {
          STATION_UID = String(uid);
          if ([...paradaSelect.options].some((o) => o.value === STATION_UID)) {
            paradaSelect.value = STATION_UID;
          }
          updateFavToggle();
          fetchStation();
        }

        /* -------------------- HELPERS -------------------- */
        function setStatus(text, type) {
          el.status.textContent = text;
          el.status.className = "status" + (type ? " " + type : "");
        }

        function setLoading(isLoading) {
          el.refreshBtn.disabled = isLoading;
          el.refreshBtn.innerHTML = isLoading
            ? '<span class="spinner"></span>Actualizando'
            : "Actualizar";
        }

        function formatTime(isoString) {
          if (!isoString) return "—";
          const d = new Date(isoString);
          if (isNaN(d.getTime())) return "—";
          return d.toLocaleTimeString("es-ES", {
            hour: "2-digit",
            minute: "2-digit",
          });
        }

        function escapeHtml(str) {
          return String(str).replace(/[&<>"']/g, (m) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[m]));
        }

        function normalize(str) {
          return String(str || "")
            .toLowerCase()
            .replace(/_/g, " ")
            .replace(/\s+/g, " ")
            .trim();
        }

        /* -------------------- FETCH -------------------- */
        async function fetchStation() {
          setLoading(true);
          setStatus("Consultando datos…", null);

          if (STATION_UID == null) {
            if (paradaSelect.options.length > 0) {
              STATION_UID = paradaSelect.value || paradaSelect.options[0].value;
            } else {
              STATION_UID = "1";
            }
          }

          try {
            const response = await fetch(API_URL, { cache: "no-store" });
            if (!response.ok) throw new Error("HTTP " + response.status);

            const data = await response.json();
            const stations = data?.network?.stations;
            if (!Array.isArray(stations))
              throw new Error("Formato de respuesta inesperado");

            stationsCache = stations;

            if (!alreadyOrdered) {
              rebuildSelect();

              if (favs.size > 0) {
                const firstFavUid = [...favs].find((uid) =>
                  stations.some((s) => String(s.extra?.uid) === uid)
                );
                if (firstFavUid) {
                  STATION_UID = firstFavUid;
                  paradaSelect.value = firstFavUid;
                }
              }

              if (
                !STATION_UID ||
                !stations.some((s) => String(s.extra?.uid) === STATION_UID)
              ) {
                const firstOpt = paradaSelect.options[0];
                if (firstOpt) {
                  STATION_UID = firstOpt.value;
                  paradaSelect.value = STATION_UID;
                }
              }

              alreadyOrdered = true;
            } else {
              rebuildSelect();
            }

            updateFavToggle();

            const station = stations.find(
              (s) => String(s.extra?.uid) === String(STATION_UID)
            );

            if (!station) {
              el.stationName.textContent = "Parada " + STATION_UID;
              el.bigNumber.textContent = "—";
              el.bigNumber.className = "big-number";
              el.freeBikes.textContent = "—";
              el.totalSlots.textContent = "—";
              setStatus("No se ha encontrado la estación en la API", "error");
              return;
            }

            const freeSlots = station.empty_slots ?? 0;
            const freeBikes = station.free_bikes ?? 0;
            const totalSlots = station.extra?.slots ?? freeSlots + freeBikes;
            const isOpen =
              station.extra?.renting !== false &&
              station.extra?.returning !== false;

            el.stationName.textContent =
              station.extra?.address ||
              station.name ||
              "Parada " + STATION_UID;

            el.bigNumber.textContent = freeSlots;
            el.bigNumber.className =
              "big-number" +
              (freeSlots === 0 ? " danger" : freeSlots < 3 ? " warn" : "");

            el.freeBikes.textContent = freeBikes;
            el.totalSlots.textContent = totalSlots;

            setStatus(
              isOpen ? "Estación operativa" : "Estación cerrada temporalmente",
              isOpen ? "ok" : "error"
            );

            el.lastUpdate.textContent =
              "Actualizado: " + formatTime(station.timestamp);
          } catch (err) {
            console.error(err);
            setStatus("Error al conectar con la API", "error");
            el.lastUpdate.textContent = "—";
          } finally {
            setLoading(false);
          }
        }

        /* -------------------- EVENTOS -------------------- */
        paradaSelect.addEventListener("change", () => {
          STATION_UID = paradaSelect.value;
          updateFavToggle();
          fetchStation();
        });

        favToggle.addEventListener("click", () => {
          if (STATION_UID == null) return;
          toggleFav(STATION_UID);
        });

        searchInput.addEventListener("input", (e) => {
          renderSearchResults(e.target.value);
        });

        searchInput.addEventListener("focus", (e) => {
          if (e.target.value || onlyFavsCheckbox.checked) {
            renderSearchResults(e.target.value);
          }
        });

        onlyFavsCheckbox.addEventListener("change", () => {
          renderSearchResults(searchInput.value);
        });

        searchResults.addEventListener("click", (e) => {
          const star = e.target.closest(".star-btn");
          if (star) {
            e.stopPropagation();
            toggleFav(star.dataset.star);
            return;
          }
          const item = e.target.closest(".search-item");
          if (!item) return;
          selectFromSearch(item.dataset.uid);
          searchInput.value = "";
          searchResults.hidden = true;
          searchInput.blur();
        });

        document.addEventListener("click", (e) => {
          if (!e.target.closest(".search-wrap")) {
            searchResults.hidden = true;
          }
        });

        searchInput.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            searchResults.hidden = true;
            searchInput.blur();
          }
        });

        function startAutoRefresh() {
          if (intervalId) clearInterval(intervalId);
          intervalId = setInterval(fetchStation, REFRESH_MS);
        }

        el.refreshBtn.addEventListener("click", fetchStation);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) fetchStation();
        });

        /* -------------------- INICIO -------------------- */
        rebuildSelect();

        if (
          !STATION_UID ||
          ![...paradaSelect.options].some((o) => o.value === STATION_UID)
        ) {
          if (paradaSelect.options.length > 0) {
            paradaSelect.selectedIndex = 0;
            STATION_UID = paradaSelect.options[0].value;
          } else {
            STATION_UID = "1";
          }
        }

        updateFavToggle();

        fetchStation().then(startAutoRefresh);

        window.addEventListener("beforeunload", () => {
          if (intervalId) clearInterval(intervalId);
        });
      })();
    </script>
  </body>
</html>
